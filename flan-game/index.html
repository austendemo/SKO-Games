<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍮 Flan Clicker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0a00;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      font-family: Georgia, serif;
      transition: background 0.6s;
    }
    h1 {
      color: #f5c842;
      font-size: 3rem;
      margin-bottom: 6px;
      text-shadow: 0 0 20px #f5a623, 0 0 40px #ff6600;
      letter-spacing: 0.05em;
    }
    #level-display { color: #f5a623; font-size: 1.3rem; margin-bottom: 2px; }
    #click-count { color: #ccc; font-size: 1rem; margin-bottom: 16px; }
    #flan-container {
      position: relative;
      cursor: pointer;
      width: 380px;
      height: 380px;
      filter: drop-shadow(0 0 24px #f5a62388);
      transition: filter 0.3s;
    }
    #flan-container:hover {
      filter: drop-shadow(0 0 40px #f5c842cc);
    }
    #flan {
      width: 380px;
      height: 380px;
      transform-origin: center bottom;
      user-select: none;
    }
    #level-name {
      color: #fff;
      font-size: 1.8rem;
      font-weight: bold;
      margin-top: 14px;
      min-height: 40px;
      text-align: center;
      text-shadow: 0 0 12px currentColor;
      letter-spacing: 0.04em;
    }
    #particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
    #trademark {
      position: fixed;
      bottom: 18px;
      left: 22px;
      color: rgba(255, 220, 100, 0.85);
      font-size: 1.5rem;
      font-family: Georgia, serif;
      font-weight: bold;
      pointer-events: none;
      letter-spacing: 0.05em;
      text-shadow: 0 0 10px #f5a623aa;
    }
  </style>
</head>
<body>
  <h1>🍮 Flan Clicker</h1>
  <div id="level-display">Level: <span id="level-num">0</span></div>
  <div id="click-count">Clicks: <span id="clicks">0</span></div>
  <div id="flan-container">
    <canvas id="flan" width="380" height="380"></canvas>
  </div>
  <div id="level-name">Click the flan!</div>
  <canvas id="particles"></canvas>
  <div id="trademark">™ Trademarked by Kevin Tran</div>

  <script>
    const flanCanvas = document.getElementById('flan');
    const ctx = flanCanvas.getContext('2d');
    const pCanvas = document.getElementById('particles');
    const pCtx = pCanvas.getContext('2d');
    const levelNameEl = document.getElementById('level-name');
    const levelNumEl = document.getElementById('level-num');
    const clicksEl = document.getElementById('clicks');
    const flanContainer = document.getElementById('flan-container');
    const trademark = document.getElementById('trademark');
    const body = document.body;

    const W = 380, H = 380, CX = W / 2, CY = H / 2;

    let clicks = 0;
    let shaking = false;
    let particles = [];
    let screenRipples = [];

    const LEVELS = [
      { threshold: 0,  name: 'Click the flan!',           bg: '#1a0a00', shake: 0,  wobble: 0,  color: '#fff' },
      { threshold: 1,  name: 'It wiggles 🍮',              bg: '#1a0a00', shake: 5,  wobble: 2,  color: '#f5c842' },
      { threshold: 5,  name: 'It shimmies! 😄',            bg: '#2a1200', shake: 10, wobble: 5,  color: '#ffaa00' },
      { threshold: 15, name: 'IT JIGGLE-WIGGLES 🌊',       bg: '#3a1800', shake: 20, wobble: 9,  color: '#ff6600' },
      { threshold: 30, name: '🔥 FULL FLAN FRENZY 🔥',     bg: '#4a0000', shake: 36, wobble: 14, color: '#ff2200' },
      { threshold: 50, name: '🍮💥 FLAN OVERLOAD 💥🍮',   bg: '#6a0000', shake: 55, wobble: 22, color: '#ff00ff' },
    ];

    function getLevel() {
      let lv = 0;
      for (let i = 0; i < LEVELS.length; i++) {
        if (clicks >= LEVELS[i].threshold) lv = i;
      }
      return lv;
    }

    function drawFlan(w) {
      ctx.clearRect(0, 0, W, H);
      const t = Date.now() / 280;
      const lv = getLevel();

      // Glow aura at high levels
      if (lv >= 3) {
        const grad = ctx.createRadialGradient(CX, CY, 60, CX, CY, 200);
        grad.addColorStop(0, `rgba(255, 160, 0, ${0.08 * (lv - 1)})`);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);
      }

      // Rainbow shimmer at max level
      if (lv >= 5) {
        const hue = (Date.now() / 10) % 360;
        ctx.save();
        ctx.globalAlpha = 0.12;
        ctx.fillStyle = `hsl(${hue}, 100%, 60%)`;
        ctx.beginPath();
        ctx.ellipse(CX, CY + 10, 160, 130, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Caramel sauce top
      const caramelGrad = ctx.createRadialGradient(CX - 20, CY - 90, 10, CX, CY - 80, 100);
      caramelGrad.addColorStop(0, '#d4752a');
      caramelGrad.addColorStop(1, '#8b3e02');
      ctx.fillStyle = caramelGrad;
      ctx.beginPath();
      ctx.ellipse(CX, CY - 80, 110 + Math.sin(t) * w, 42, 0, 0, Math.PI * 2);
      ctx.fill();

      // Caramel drips
      for (let i = 0; i < 5; i++) {
        const angle = (i / 5) * Math.PI * 2;
        const dx = Math.cos(angle) * 70;
        const dy = 12 + Math.sin(t + i * 1.2) * w * 0.7;
        ctx.fillStyle = '#a0510a';
        ctx.beginPath();
        ctx.ellipse(CX + dx * 0.7, CY - 50 + dy, 12, 20, angle * 0.3, 0, Math.PI * 2);
        ctx.fill();
      }

      // Main flan body
      const flanGrad = ctx.createRadialGradient(CX - 30, CY - 20, 20, CX, CY, 150);
      flanGrad.addColorStop(0, '#ffe066');
      flanGrad.addColorStop(0.6, '#f5c842');
      flanGrad.addColorStop(1, '#c89a00');
      ctx.fillStyle = flanGrad;
      ctx.beginPath();
      ctx.ellipse(
        CX,
        CY + 10,
        130 + Math.sin(t * 1.3) * w,
        100 + Math.cos(t) * w * 0.6,
        0, 0, Math.PI * 2
      );
      ctx.fill();

      // Jiggle lines at high level
      if (lv >= 3) {
        ctx.save();
        ctx.strokeStyle = `rgba(255,255,255,${0.08 + lv * 0.03})`;
        ctx.lineWidth = 2;
        for (let i = 0; i < 4; i++) {
          ctx.beginPath();
          ctx.ellipse(CX, CY + 10, 60 + i * 22 + Math.sin(t + i) * w * 0.3, 46 + i * 18, 0, 0, Math.PI * 2);
          ctx.stroke();
        }
        ctx.restore();
      }

      // Highlight
      ctx.fillStyle = 'rgba(255,255,255,0.22)';
      ctx.beginPath();
      ctx.ellipse(CX - 35, CY - 28, 38, 22, -0.4, 0, Math.PI * 2);
      ctx.fill();

      // Secondary highlight
      ctx.fillStyle = 'rgba(255,255,255,0.1)';
      ctx.beginPath();
      ctx.ellipse(CX + 30, CY + 30, 20, 12, 0.3, 0, Math.PI * 2);
      ctx.fill();

      // Base plate
      const plateGrad = ctx.createLinearGradient(CX - 150, CY + 100, CX + 150, CY + 120);
      plateGrad.addColorStop(0, '#a07800');
      plateGrad.addColorStop(0.5, '#d4a800');
      plateGrad.addColorStop(1, '#a07800');
      ctx.fillStyle = plateGrad;
      ctx.beginPath();
      ctx.ellipse(CX, CY + 110, 145 + Math.sin(t * 0.8) * w * 0.4, 24, 0, 0, Math.PI * 2);
      ctx.fill();

      // Plate shine
      ctx.fillStyle = 'rgba(255,255,200,0.18)';
      ctx.beginPath();
      ctx.ellipse(CX - 20, CY + 106, 60, 8, -0.1, 0, Math.PI * 2);
      ctx.fill();
    }

    const PARTICLE_SHAPES = ['circle', 'star', 'square', 'flan'];

    function spawnParticles(x, y, level) {
      const palettes = [
        ['#f5c842', '#b5651d', '#fff'],
        ['#f5c842', '#ff9900', '#fff', '#ffe0a0'],
        ['#ff9900', '#ff6600', '#ffcc00', '#fff', '#ff3300'],
        ['#ff6600', '#ff0000', '#ff9900', '#fff', '#ffcc00', '#ff66ff'],
        ['#ff0000', '#ff6600', '#ff00ff', '#ffff00', '#00ffff', '#fff'],
        ['#ff00ff', '#00ffff', '#ffff00', '#ff6600', '#ff0000', '#00ff88', '#fff'],
      ];
      const colors = palettes[Math.min(level, palettes.length - 1)];
      const count = 18 + level * 12;
      for (let i = 0; i < count; i++) {
        const speed = 6 + level * 4;
        const angle = Math.random() * Math.PI * 2;
        particles.push({
          x, y,
          vx: Math.cos(angle) * speed * Math.random(),
          vy: Math.sin(angle) * speed * Math.random() - (3 + level * 2),
          life: 1,
          decay: 0.012 + Math.random() * 0.018,
          color: colors[Math.floor(Math.random() * colors.length)],
          r: 5 + Math.random() * (6 + level * 2),
          shape: PARTICLE_SHAPES[Math.floor(Math.random() * (level < 2 ? 1 : PARTICLE_SHAPES.length))],
          spin: (Math.random() - 0.5) * 0.3,
          angle: Math.random() * Math.PI * 2,
          text: level >= 4 ? ['🍮','✨','💥','🔥','⭐'][Math.floor(Math.random() * 5)] : null,
        });
      }

      // At high levels, spawn ripple
      if (level >= 3) {
        screenRipples.push({ x, y, r: 0, life: 1, color: colors[0] });
      }
    }

    function drawStar(ctx, x, y, r, angle) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.beginPath();
      for (let i = 0; i < 5; i++) {
        const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
        const b = (i * 4 * Math.PI) / 5 + (2 * Math.PI) / 5 - Math.PI / 2;
        if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
        else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
        ctx.lineTo(Math.cos(b) * r * 0.45, Math.sin(b) * r * 0.45);
      }
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function updateParticles() {
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);

      // Draw ripples
      screenRipples = screenRipples.filter(r => r.life > 0);
      for (const rip of screenRipples) {
        rip.r += 18;
        rip.life -= 0.04;
        pCtx.save();
        pCtx.globalAlpha = rip.life * 0.5;
        pCtx.strokeStyle = rip.color;
        pCtx.lineWidth = 3;
        pCtx.beginPath();
        pCtx.arc(rip.x, rip.y, rip.r, 0, Math.PI * 2);
        pCtx.stroke();
        pCtx.restore();
      }

      particles = particles.filter(p => p.life > 0);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.22;
        p.vx *= 0.98;
        p.life -= p.decay;
        p.angle += p.spin;
        pCtx.globalAlpha = p.life;
        pCtx.fillStyle = p.color;

        if (p.text) {
          pCtx.font = `${p.r * 2}px serif`;
          pCtx.fillText(p.text, p.x, p.y);
        } else if (p.shape === 'star') {
          drawStar(pCtx, p.x, p.y, p.r, p.angle);
        } else if (p.shape === 'square') {
          pCtx.save();
          pCtx.translate(p.x, p.y);
          pCtx.rotate(p.angle);
          pCtx.fillRect(-p.r, -p.r, p.r * 2, p.r * 2);
          pCtx.restore();
        } else {
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          pCtx.fill();
        }
      }
      pCtx.globalAlpha = 1;
    }

    function shake(el, amt) {
      if (shaking) return;
      shaking = true;
      let f = 0;
      const frames = 14 + Math.floor(amt / 5);
      const iv = setInterval(() => {
        const dx = (Math.random() - 0.5) * amt * 2.2;
        const dy = (Math.random() - 0.5) * amt * 1.2;
        const rot = dx * 0.4;
        el.style.transform = `translate(${dx}px, ${dy}px) rotate(${rot}deg) scale(${1 + Math.abs(dx) * 0.002})`;
        if (++f > frames) {
          clearInterval(iv);
          el.style.transform = '';
          shaking = false;
        }
      }, 25);
    }

    function flash(level) {
      if (level < 2) return;
      const hue = level >= 5 ? (Date.now() / 8) % 360 : null;
      const bg = hue !== null
        ? `hsla(${hue}, 100%, 55%, 0.22)`
        : `rgba(255, ${200 - level * 30}, 0, ${(level - 1) * 0.1})`;
      const d = document.createElement('div');
      d.style.cssText = `position:fixed;top:0;left:0;width:100%;height:100%;background:${bg};pointer-events:none;z-index:4;`;
      document.body.appendChild(d);
      setTimeout(() => d.remove(), level >= 4 ? 200 : 130);
    }

    function updateTrademark(level) {
      const lv = LEVELS[level];
      trademark.style.textShadow = level >= 3 ? `0 0 16px ${lv.color}, 0 0 30px ${lv.color}` : '0 0 10px #f5a623aa';
      trademark.style.color = level >= 2 ? lv.color : 'rgba(255, 220, 100, 0.85)';
    }

    flanCanvas.addEventListener('click', (e) => {
      clicks++;
      clicksEl.textContent = clicks;
      const level = getLevel();
      const lv = LEVELS[level];
      levelNumEl.textContent = level;
      levelNameEl.textContent = lv.name;
      levelNameEl.style.color = lv.color;
      body.style.background = lv.bg;
      spawnParticles(e.clientX, e.clientY, level);
      shake(flanContainer, lv.shake);
      flash(level);
      updateTrademark(level);
    });

    function resize() {
      pCanvas.width = window.innerWidth;
      pCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    (function loop() {
      drawFlan(LEVELS[getLevel()].wobble);
      updateParticles();
      requestAnimationFrame(loop);
    })();
  </script>
</body>
</html>
